name: Build Jarvis APK
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack project
        run: unzip -o JarvisApp.zip -d proj
      - name: Build APK
        run: gradle -p proj/Jarvis assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: proj/Jarvis/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-${{ github.run_number }}
          name: Jarvis APK ${{ github.run_number }}
          files: proj/Jarvis/app/build/outputs/apk/debug/app-debug.apk
